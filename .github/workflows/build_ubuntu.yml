name: UbuntuRelease
# CI workflow for Ubuntu builds and testing
on: 
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false        with:
          persist-credentials: false    - name: apt-install
      run: |
        sudo apt update
        sudo apt install -y libusb-1.0-0-dev libdbus-1-dev pkg-config cmake
    - name: run-cmake
      run: |
        cd ${{github.workspace}}
        mkdir build && cd build
        cmake -DBUILD_TESTING=1 -DCMAKE_BUILD_TYPE=Release ..
    - name: make
      run: |
        cd ${{github.workspace}}/build
        make -j4
    - name: test
      run: |
        cd ${{github.workspace}}/build
        ctest -C Release --timeout 600 --output-on-failure
    - name: pack
      run: |
        cd ${{github.workspace}}/build
        cpack -C Release
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-deb
        path: |
          ${{github.workspace}}/build/*.deb
          ${{github.workspace}}/build/*.deb.sha256
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-tar
        path: |
          ${{github.workspace}}/build/*.tar.xz.sha256
          ${{github.workspace}}/build/*.tar.xz
