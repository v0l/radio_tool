name: Rust
# Self contained: the reference firmware files live in the repo, so this needs
# no cmake, no libusb and no C++ build.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the serial transport needs libudev, and btleplug needs dbus, on Linux
      - name: apt-install
        run: sudo apt update && sudo apt install -y libudev-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: fmt
        working-directory: rust
        run: cargo fmt --check

      - name: clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: rust
        run: cargo test --all-targets

      - name: doc tests
        working-directory: rust
        run: cargo test --doc

  # Cargo.toml claims a minimum of 1.85, which is what edition 2024 needs.
  # Nothing checked that until this job existed.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: apt-install
        run: sudo apt update && sudo apt install -y libudev-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: check
        working-directory: rust
        run: cargo check --all-targets
