name: Rust
# Self contained: the reference firmware files live in the repo, so this needs
# no cmake, no libusb and no C++ build.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always


jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # the serial transport needs libudev, and btleplug needs dbus, on Linux
      - name: apt-install
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y libudev-dev libdbus-1-dev pkg-config libgl1-mesa-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust

      - name: fmt
        working-directory: rust
        run: cargo fmt --check

      - name: clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: rust
        run: cargo test --all-targets

      - name: doc tests
        working-directory: rust
        run: cargo test --doc

  # Cargo.toml claims a minimum of 1.95, which is what egui_bench needs.
  # Nothing checked that until this job existed.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: apt-install
        run: sudo apt update && sudo apt install -y libudev-dev libdbus-1-dev pkg-config libgl1-mesa-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust

      - name: check
        working-directory: rust
        run: cargo check --all-targets
